<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFDE59">
    <title>Notifikasi & Info Terbaru - ArulzXD Store</title>
    <meta name="description" content="Pusat pemberitahuan promo, pembaruan sistem, dan informasi penting akun Anda di ArulzXD Store.">

    <!-- Favicon & Icons -->

    <link rel="shortcut icon" href="https://cdn.larasxd.my.id/files/1wh5do.png" type="image/png">
    <link rel="apple-touch-icon" href="https://cdn.larasxd.my.id/files/1wh5do.png">

    <!-- Styles & Scripts -->

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        cyber: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        neoYellow: '#FFDE59',
                        neoCyan: '#00E5FF',
                        neoPink: '#FF79C6',
                        neoGreen: '#00E676',
                        neoBg: '#F4F0EA',
                        neoCard: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F4F0EA; color: #000000; overflow-x: hidden; }

        .neo-box {
            background-color: #FFFFFF;
            border: 3px solid #000000;
            box-shadow: 5px 5px 0px #000000;
        }

        .neo-btn {
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .neo-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }
        .neo-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        /* =========================================================
           LIQUID NOTCH CURVE BOTTOM NAVIGATION (6 ITEM: NOTIF + PROFIL)
           ========================================================= */
        .liquid-nav-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 100%;
            margin: 0;
            z-index: 40;
            height: 66px;
            user-select: none;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: transparent;
        }
        .liquid-nav-bg {
            position: absolute;
            inset: 0;
            filter: drop-shadow(0px -3px 0px rgba(0, 0, 0, 0.08));
            pointer-events: none;
        }
        .liquid-nav-svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }
        .liquid-floating-orb {
            position: absolute;
            top: -26px;
            width: 46px;
            height: 46px;
            margin-left: -23px;
            border-radius: 9999px;
            background-color: #FFDF4F;
            border: 3px solid #000000;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            pointer-events: none;
            will-change: left, transform;
            transition: left 0.48s cubic-bezier(0.34, 1.38, 0.64, 1);
        }
        .liquid-floating-orb.orb-bounce {
            animation: orbJump 0.48s cubic-bezier(0.34, 1.5, 0.64, 1);
        }
        @keyframes orbJump {
            0% { transform: translate3d(0, 14px, 0) scale(0.82); }
            55% { transform: translate3d(0, -5px, 0) scale(1.06); }
            100% { transform: translate3d(0, 0px, 0) scale(1); }
        }
        .liquid-nav-items {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            height: 66px;
            align-items: center;
        }
        .liquid-nav-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(0, 0, 0, 0.72);
            text-decoration: none;
            transition: color 0.25s ease;
        }
        .liquid-nav-item i {
            font-size: 15px;
            transition: opacity 0.2s ease, transform 0.32s ease;
        }
        .liquid-nav-item span.nav-text {
            font-size: 9.5px;
            font-weight: 800;
            margin-top: 3px;
            transition: opacity 0.2s ease, transform 0.32s ease, color 0.25s ease;
        }
        .liquid-nav-item.active i {
            opacity: 0;
            transform: translateY(-16px) scale(0.4);
        }
        .liquid-nav-item.active span.nav-text {
            opacity: 1;
            color: #000000;
            font-weight: 900;
            transform: translateY(3px);
        }
        .notif-nav-badge {
            position: absolute;
            top: 6px;
            right: calc(50% - 19px);
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            border-radius: 9999px;
            background-color: #FF2E4C;
            color: #FFFFFF;
            border: 2px solid #000000;
            font-size: 9px;
            font-weight: 900;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            box-shadow: 1.5px 1.5px 0px #000000;
        }
        .notif-nav-badge.hidden {
            display: none !important;
        }

        .swal2-popup.cyber-swal {
            background: #FFFFFF !important;
            border: 3px solid #000000 !important;
            border-radius: 20px !important;
            color: #000000 !important;
            box-shadow: 6px 6px 0px #000000 !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }
    </style>

    <script>
        let allNotifications = [];
        let currentNotifFilter = 'all';
        let currentSessionUserKey = 'guest';

        /* =========================================================
           LIQUID NOTCH CURVE NAVIGATION (6 ITEM)
           ========================================================= */
        let liquidNavAnimationFrame = null;
        let currentNotchPixelX = 0;
        let activeNavIndex = 4;
        const NAV_ITEM_COUNT = 6;

        function buildPixelNotchPath(cx, totalW, totalH) {
            const notchHalfW = 42;
            const notchDepth = 27;
            const c1 = 19;
            const c2 = 17;

            const leftEdge = Math.max(2, cx - notchHalfW);
            const rightEdge = Math.min(totalW - 2, cx + notchHalfW);

            return [
                `M 0,1.5`,
                `L ${leftEdge},1.5`,
                `C ${leftEdge + c1},1.5 ${cx - c2},${notchDepth} ${cx},${notchDepth}`,
                `C ${cx + c2},${notchDepth} ${rightEdge - c1},1.5 ${rightEdge},1.5`,
                `L ${totalW},1.5`,
                `L ${totalW},${totalH}`,
                `L 0,${totalH}`,
                `Z`
            ].join(' ');
        }

        function syncSvgViewBox() {
            const nav = document.getElementById('liquidBottomNav');
            const svg = document.getElementById('liquidNavSvg');
            if (!nav || !svg) return { w: 360, h: 66 };
            const rect = nav.getBoundingClientRect();
            const w = Math.max(300, Math.round(rect.width));
            const h = Math.max(66, Math.round(rect.height));
            svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
            svg.setAttribute('preserveAspectRatio', 'none');
            return { w, h };
        }

        function animateLiquidNotchTo(targetPxX) {
            if (liquidNavAnimationFrame) cancelAnimationFrame(liquidNavAnimationFrame);
            const pathEl = document.getElementById('liquidNavPath');
            if (!pathEl) return;
            const { w, h } = syncSvgViewBox();
            const startPxX = currentNotchPixelX || targetPxX;
            const distance = targetPxX - startPxX;
            const duration = 450;
            const startTime = performance.now();

            function easeOutBack(t) {
                const c1 = 1.4;
                const c3 = c1 + 1;
                return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
            }

            function step(now) {
                const elapsed = Math.min((now - startTime) / duration, 1);
                const eased = easeOutBack(elapsed);
                currentNotchPixelX = startPxX + distance * eased;
                pathEl.setAttribute('d', buildPixelNotchPath(currentNotchPixelX, w, h));

                if (elapsed < 1) {
                    liquidNavAnimationFrame = requestAnimationFrame(step);
                } else {
                    currentNotchPixelX = targetPxX;
                    pathEl.setAttribute('d', buildPixelNotchPath(targetPxX, w, h));
                }
            }
            liquidNavAnimationFrame = requestAnimationFrame(step);
        }

        function setLiquidNavActive(index, animate = true) {
            activeNavIndex = index;
            const items = document.querySelectorAll('.liquid-nav-item');
            const orb = document.getElementById('liquidFloatingOrb');
            const orbIcon = document.getElementById('liquidOrbIcon');
            const pathEl = document.getElementById('liquidNavPath');

            if (!items.length || !orb || !orbIcon || !pathEl) return;

            items.forEach((item, idx) => {
                item.classList.toggle('active', idx === index);
            });

            const activeItem = items[index];
            if (!activeItem) return;

            const { w, h } = syncSvgViewBox();
            const percentLeft = ((index + 0.5) / NAV_ITEM_COUNT) * 100;
            const targetPxX = ((index + 0.5) / NAV_ITEM_COUNT) * w;

            orb.style.left = `${percentLeft}%`;
            orbIcon.className = `${activeItem.dataset.icon} text-lg`;

            if (animate) {
                orb.classList.remove('orb-bounce');
                void orb.offsetWidth;
                orb.classList.add('orb-bounce');
                animateLiquidNotchTo(targetPxX);
            } else {
                currentNotchPixelX = targetPxX;
                pathEl.setAttribute('d', buildPixelNotchPath(targetPxX, w, h));
            }
        }

        function handleLiquidNavClick(e, el) {
            const targetHref = el.getAttribute('href');
            const index = Number(el.dataset.index);
            const currentPath = window.location.pathname;

            setLiquidNavActive(index, true);

            if (targetHref && targetHref !== currentPath) {
                e.preventDefault();
                setTimeout(() => {
                    window.location.href = targetHref;
                }, 320);
            } else {
                e.preventDefault();
            }
        }

        window.addEventListener('resize', () => {
            setLiquidNavActive(activeNavIndex, false);
        });

        /* =========================================================
           MANAJEMEN STATUS BACA SESI (HILANG SAAT DIBACA, MUNCUL LAGI SAAT LOGOUT -> LOGIN)
           ========================================================= */
        function getSessionReadStorageKey() {
            return `arulz_notif_read_session_${currentSessionUserKey}`;
        }

        function getSessionReadIds() {
            try {
                const raw = localStorage.getItem(getSessionReadStorageKey());
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function addSessionReadIds(ids) {
            try {
                const current = new Set(getSessionReadIds());
                ids.forEach((id) => current.add(String(id)));
                localStorage.setItem(getSessionReadStorageKey(), JSON.stringify(Array.from(current)));
            } catch (e) {}
        }

        function isNotificationReadInSession(notif) {
            const sessionReads = getSessionReadIds();
            return sessionReads.includes(String(notif.id));
        }

        function updateNavBadgeUI(unreadCount) {
            const navBadge = document.getElementById('navNotifBadge');
            const orbBadge = document.getElementById('orbNotifBadge');
            const heroCount = document.getElementById('unreadNotifBadgeCount');

            if (heroCount) {
                heroCount.innerText = `${unreadCount} Notifikasi`;
            }

            const displayVal = unreadCount > 99 ? '99+' : String(unreadCount);
            [navBadge, orbBadge].forEach((badge) => {
                if (!badge) return;
                if (unreadCount > 0) {
                    badge.innerText = displayVal;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            });
        }

        function setNotifFilter(filterVal, btnEl) {
            currentNotifFilter = filterVal;
            document.querySelectorAll('.notif-filter-tab').forEach((btn) => {
                btn.classList.remove('bg-neoYellow');
                btn.classList.add('bg-white');
            });
            if (btnEl) {
                btnEl.classList.remove('bg-white');
                btnEl.classList.add('bg-neoYellow');
            }
            renderFilteredNotifications();
        }

        async function loadNotifications() {
            const container = document.getElementById('notificationListContainer');
            try {
                const userRes = await fetch('/api/user-status');
                const userData = await userRes.json();

                const authLabel = document.getElementById('nav-auth-label');
                const authLink = document.getElementById('nav-auth-link');

                if (userData.loggedIn && userData.user) {
                    currentSessionUserKey = (userData.user.email || userData.user.id || 'user').toLowerCase();
                    if (authLabel) authLabel.innerText = 'Profil';
                    if (authLink) authLink.href = '/profile';
                } else {
                    currentSessionUserKey = 'guest';
                    if (authLabel) authLabel.innerText = 'Akun';
                    if (authLink) authLink.href = '/login';
                }

                const res = await fetch('/api/notifications', { cache: 'no-store' });
                const data = await res.json();

                if (data.status && Array.isArray(data.notifications)) {
                    allNotifications = data.notifications;
                    const unreadCount = allNotifications.filter((n) => !isNotificationReadInSession(n)).length;
                    updateNavBadgeUI(unreadCount);
                    renderFilteredNotifications();
                } else {
                    allNotifications = [];
                    updateNavBadgeUI(0);
                    renderFilteredNotifications();
                }
            } catch (err) {
                container.innerHTML = `
                    <div class="neo-box p-6 rounded-2xl bg-neoPink text-center text-xs font-black font-cyber">
                        Gagal memuat notifikasi. Silakan coba lagi.
                    </div>
                `;
            }
        }

        function renderFilteredNotifications() {
            const container = document.getElementById('notificationListContainer');
            const keyword = (document.getElementById('notifSearchInput')?.value || '').trim().toLowerCase();

            const filtered = allNotifications.filter((n) => {
                const isRead = isNotificationReadInSession(n);
                const matchFilter =
                    currentNotifFilter === 'all' ||
                    (currentNotifFilter === 'unread' && !isRead) ||
                    (n.type || 'info').toLowerCase() === currentNotifFilter;

                const matchKeyword =
                    !keyword ||
                    (n.title || '').toLowerCase().includes(keyword) ||
                    (n.message || '').toLowerCase().includes(keyword);

                return matchFilter && matchKeyword;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="neo-box p-8 rounded-2xl bg-white text-center space-y-3">
                        <div class="w-12 h-12 rounded-2xl bg-neoYellow border-2 border-black mx-auto flex items-center justify-center text-xl">
                            <i class="fa-regular fa-bell-slash"></i>
                        </div>
                        <h3 class="text-sm font-black font-cyber uppercase">Tidak Ada Notifikasi</h3>
                        <p class="text-xs font-bold text-slate-600">Belum ada pemberitahuan yang sesuai dengan filter saat ini.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((notif) => {
                const isRead = isNotificationReadInSession(notif);
                const typeUpper = (notif.type || 'info').toUpperCase();

                let typeClass = 'bg-neoCyan text-black';
                let typeIcon = 'fa-circle-info';
                if (typeUpper === 'PROMO') {
                    typeClass = 'bg-neoYellow text-black';
                    typeIcon = 'fa-tags';
                } else if (typeUpper === 'SISTEM') {
                    typeClass = 'bg-neoPink text-black';
                    typeIcon = 'fa-server';
                } else if (typeUpper === 'TRANSAKSI') {
                    typeClass = 'bg-neoGreen text-black';
                    typeIcon = 'fa-receipt';
                }

                const dateStr = notif.createdAt
                    ? new Date(notif.createdAt).toLocaleString('id-ID', {
                        day: '2-digit',
                        month: 'short',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })
                    : '-';

                return `
                    <article onclick="openNotificationDetail('${notif.id}')" class="neo-box p-4 sm:p-5 rounded-2xl ${isRead ? 'bg-white' : 'bg-[#FFFDF2]'} cursor-pointer hover:translate-x-[-2px] hover:translate-y-[-2px] transition-transform flex flex-col sm:flex-row sm:items-center justify-between gap-4 relative">
                        <div class="space-y-1.5 flex-1">
                            <div class="flex flex-wrap items-center gap-2">
                                ${!isRead ? `
                                    <span class="inline-flex items-center gap-1 text-[10px] font-black font-cyber px-2.5 py-0.5 rounded-md border-2 border-black bg-[#FF2E4C] text-white">
                                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span> BARU
                                    </span>
                                ` : `
                                    <span class="inline-flex items-center gap-1 text-[10px] font-black font-cyber px-2.5 py-0.5 rounded-md border-2 border-black bg-neoBg text-slate-700">
                                        <i class="fa-solid fa-check"></i> DIBACA
                                    </span>
                                `}
                                <span class="inline-flex items-center gap-1 text-[10px] font-black font-cyber px-2.5 py-0.5 rounded-md border-2 border-black ${typeClass}">
                                    <i class="fa-solid ${typeIcon}"></i> ${typeUpper}
                                </span>
                                <span class="text-[11px] font-mono font-bold text-slate-600">
                                    <i class="fa-regular fa-clock mr-1"></i>${dateStr} WIB
                                </span>
                            </div>
                            <h2 class="text-sm sm:text-base font-black font-cyber text-black">${notif.title}</h2>
                            <p class="text-xs font-bold text-slate-700 line-clamp-2">${notif.message}</p>
                        </div>

                        <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
                            ${!isRead ? `
                                <button type="button" onclick="event.stopPropagation(); markSingleNotificationRead('${notif.id}')" class="neo-btn bg-neoGreen text-black font-cyber font-black px-3 py-2 rounded-xl text-[11px] uppercase flex items-center gap-1">
                                    <i class="fa-solid fa-check"></i> Tandai Baca
                                </button>
                            ` : ''}
                            <button type="button" class="neo-btn bg-neoYellow text-black font-cyber font-black px-3.5 py-2 rounded-xl text-[11px] uppercase flex items-center gap-1">
                                <i class="fa-solid fa-eye"></i> Baca
                            </button>
                        </div>
                    </article>
                `;
            }).join('');
        }

        async function markSingleNotificationRead(notifId) {
            addSessionReadIds([notifId]);
            const unreadCount = allNotifications.filter((n) => !isNotificationReadInSession(n)).length;
            updateNavBadgeUI(unreadCount);
            renderFilteredNotifications();

            try {
                await fetch('/api/notifications/mark-read', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notificationId: notifId })
                });
            } catch (e) {}
        }

        async function markAllNotificationsRead() {
            if (!allNotifications.length) return;
            const allIds = allNotifications.map((n) => n.id);
            addSessionReadIds(allIds);
            updateNavBadgeUI(0);
            renderFilteredNotifications();

            try {
                await fetch('/api/notifications/mark-read', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ markAll: true })
                });
            } catch (e) {}

            Swal.fire({
                icon: 'success',
                title: 'SEMUA DITANDAI DIBACA',
                text: 'Penanda notifikasi telah dibersihkan.',
                timer: 1400,
                showConfirmButton: false,
                customClass: { popup: 'cyber-swal' }
            });
        }

        function openNotificationDetail(notifId) {
            const notif = allNotifications.find((n) => String(n.id) === String(notifId));
            if (!notif) return;

            // Tandai baca otomatis saat dibuka
            markSingleNotificationRead(notif.id);

            document.getElementById('modalNotifTypeBadge').innerText = (notif.type || 'info').toUpperCase();
            document.getElementById('modalNotifTitle').innerText = notif.title;
            document.getElementById('modalNotifMessage').innerText = notif.message;
            document.getElementById('modalNotifDate').innerText = notif.createdAt
                ? new Date(notif.createdAt).toLocaleString('id-ID', {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) + ' WIB'
                : '-';

            const linkBtn = document.getElementById('modalNotifLinkBtn');
            if (notif.link) {
                linkBtn.href = notif.link;
                linkBtn.classList.remove('hidden');
            } else {
                linkBtn.classList.add('hidden');
            }

            const modal = document.getElementById('notifDetailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeNotifModal() {
            const modal = document.getElementById('notifDetailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.addEventListener('DOMContentLoaded', () => {
            setLiquidNavActive(4, false);
            loadNotifications();
        });
    </script>
</body>
</html>
